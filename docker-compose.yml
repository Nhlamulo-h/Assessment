version: '3.8'

services:
  # -------------------------------------------------------------
  # PostgreSQL Database Service
  # -------------------------------------------------------------
  db:
    image: postgres:16-alpine
    container_name: sentence-builder-db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: sentence_builder
    ports:
      - "5432:5432"
    volumes:
      # Auto-executes schema & seed data upon first startup
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d sentence_builder"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - sentence-network

  # -------------------------------------------------------------
  # Express.js REST API Backend
  # -------------------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sentence-builder-api
    restart: always
    depends_on:
      db:
        condition: service_healthy
    environment:
      PORT: 5000
      NODE_ENV: production
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: sentence_builder
      CLIENT_ORIGIN: http://localhost:4200
    ports:
      - "5000:5000"
    networks:
      - sentence-network

  # -------------------------------------------------------------
  # Angular 18+ Frontend Client (Served by Nginx)
  # -------------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: sentence-builder-web
    restart: always
    depends_on:
      - backend
    ports:
      - "4200:80"
    networks:
      - sentence-network

volumes:
  postgres_data:
    driver: local

networks:
  sentence-network:
    driver: bridge
